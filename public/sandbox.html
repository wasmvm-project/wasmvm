<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    const DEFAULT_IMPORTS = {
      "fs": "/node_polyfills/fs.js",
      "fs/promises": "/node_polyfills/fs.promises.js",
      "path": "https://esm.sh/path-browserify",
      "os": "https://esm.sh/os-browserify",
      "util": "https://esm.sh/util",
      "events": "https://esm.sh/events",
      "stream": "https://esm.sh/stream-browserify",
      "buffer": "https://esm.sh/buffer",
      "child_process": "/node_polyfills/child_process.js"
    };
  </script>
  <script type="module">
    import { Buffer } from 'https://esm.sh/buffer';
    window.Buffer = Buffer;
    window.global = window;
  </script>
  <script>
    // Listen for initialization message
    window.addEventListener('message', async (e) => {
      if (e.data?.type === 'init') {
        const { channelId, scriptUrl, importMapStr, argv } = e.data;
        
        // Inject process
        window.process = {
          argv: argv || [],
          env: {},
          cwd: () => '/home/user',
          exit: (code) => {
            window.parent.postMessage({ channelId, type: 'done', exitCode: code || 0 }, '*');
          },
          nextTick: (cb, ...args) => Promise.resolve().then(() => cb(...args)),
          platform: 'linux',
          version: 'v18.0.0',
        };
        
        // Override console
        ['log', 'info', 'warn', 'error', 'debug'].forEach(method => {
          const orig = console[method];
          console[method] = (...args) => {
            orig.apply(console, args);
            const text = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            const type = (method === 'error' || method === 'warn') ? 'stderr' : 'stdout';
            window.parent.postMessage({ channelId, type, text }, '*');
          };
        });

        // Unhandled errors
        window.addEventListener('error', (err) => {
          window.parent.postMessage({ channelId, type: 'stderr', text: err.message }, '*');
          window.parent.postMessage({ channelId, type: 'done', exitCode: 1 }, '*');
        });

        window.addEventListener('unhandledrejection', (err) => {
          window.parent.postMessage({ channelId, type: 'stderr', text: err.reason }, '*');
          window.parent.postMessage({ channelId, type: 'done', exitCode: 1 }, '*');
        });

        // Combine import maps
        let finalImports = { ...DEFAULT_IMPORTS };
        if (importMapStr) {
          try {
            const parsed = JSON.parse(importMapStr);
            if (parsed.imports) {
              finalImports = { ...finalImports, ...parsed.imports };
            }
          } catch(err) {}
        }

        const script = document.createElement('script');
        script.type = 'importmap';
        script.textContent = JSON.stringify({ imports: finalImports });
        document.head.appendChild(script);

        // Run module
        try {
          await new Promise(r => setTimeout(r, 0));
          await import(scriptUrl);
          
          setTimeout(() => {
            window.parent.postMessage({ channelId, type: 'done', exitCode: 0 }, '*');
          }, 100);
        } catch (err) {
          console.error(err);
          window.parent.postMessage({ channelId, type: 'done', exitCode: 1 }, '*');
        }
      }
    });
  </script>
</head>
<body>
</body>
</html>
