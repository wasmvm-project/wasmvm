<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Terminal Window Header -->
  <circle cx="84" cy="76" r="14" fill="#f87171" />
  <circle cx="128" cy="76" r="14" fill="#fbbf24" />
  <circle cx="172" cy="76" r="14" fill="#4ade80" />
  <line x1="40" y1="120" x2="472" y2="120" stroke="#1e293b" stroke-width="4" />

  <!-- Terminal Prompt Symbol >_ -->
  <g filter="url(#glow)">
    <!-- Prompt Chevron > -->
    <path d="M 100 180 L 210 270 L 100 360" fill="none" stroke="url(#glowGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cursor _ -->
    <line x1="240" y1="360" x2="350" y2="360" stroke="#38bdf8" stroke-width="32" stroke-linecap="round" />
  </g>

  <!-- WASM Badge / Hexagon in corner -->
  <g transform="translate(350, 200) scale(0.65)" opacity="0.95">
    <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="#1e1b4b" stroke="#818cf8" stroke-width="8" />
    <text x="100" y="115" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">W</text>
  </g>
</svg>
